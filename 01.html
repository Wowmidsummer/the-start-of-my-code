<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄钟与任务追踪</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap');
        :root {
            --accent: #ff7a18;
            --accent-2: #faae2b;
            --bg: #080808;
            --panel: #111118;
            --panel-2: #181820;
            --muted: #f0b36a;
            --text: #fdf4dd;
            --grid: rgba(255, 122, 24, 0.06);
            --chart-bg: #0c0c0c;
        }
        body.theme-default { }
        body.theme-stardew {
            --accent: #dca45f;
            --accent-2: #b67a3d;
            --bg: #120a05;
            --panel: #1c120c;
            --panel-2: #22160e;
            --muted: #d7c3a6;
            --text: #f7ead7;
            --grid: rgba(183, 140, 92, 0.12);
            --chart-bg: #1b120a;
        }
        body.theme-xumo {
            --accent: #9b7cf8;
            --accent-2: #c6b4ff;
            --bg: radial-gradient(circle at 20% 20%, rgba(155,124,248,0.08), transparent 38%), #0d0a14;
            --panel: #14101d;
            --panel-2: #1a1526;
            --muted: #c3b9de;
            --text: #f0ecff;
            --grid: rgba(155, 124, 248, 0.08);
            --chart-bg: #0f0b16;
            --xumo-bg-image: url('https://cdn.openai.com/files/assistant/task-assets/xumo-p1-bg.jpg');
            --xumo-avatar: url('https://cdn.openai.com/files/assistant/task-assets/xumo-p1-face.png');
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Press Start 2P', 'Share Tech Mono', 'Noto Sans SC', monospace;
            background: linear-gradient(90deg, transparent 24%, var(--grid) 25%, var(--grid) 26%, transparent 27%, transparent 74%, var(--grid) 75%, var(--grid) 76%, transparent 77%),
                linear-gradient(0deg, transparent 24%, var(--grid) 25%, var(--grid) 26%, transparent 27%, transparent 74%, var(--grid) 75%, var(--grid) 76%, transparent 77%),
                radial-gradient(circle at 20% 20%, rgba(255, 122, 24, 0.08), transparent 45%), var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 38px 30px 52px;
            letter-spacing: 0.3px;
        }
        body.theme-xumo {
            position: relative;
            background-blend-mode: screen, normal, overlay, normal;
            overflow-x: hidden;
        }
        body.theme-xumo::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: var(--xumo-bg-image);
            background-size: cover;
            background-position: center;
            filter: blur(4px) saturate(1.05);
            opacity: 0.55;
            z-index: -2;
        }
        body.theme-xumo::after {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 30%, rgba(155,124,248,0.25), transparent 48%),
                linear-gradient(145deg, rgba(34,24,53,0.85), rgba(14,11,20,0.9));
            z-index: -1;
            pointer-events: none;
        }
        .top-nav {
            max-width: 1600px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .brand {
            font-size: 13px;
            color: var(--text);
            letter-spacing: 1.2px;
            text-shadow: 0 0 8px rgba(0,0,0,0.5);
        }
        .theme-switch {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .theme-btn {
            padding: 10px 12px 9px;
            border: 2px solid #222;
            background: #0c0c0c;
            color: var(--muted);
            cursor: pointer;
            font-size: 10px;
            letter-spacing: 0.8px;
            box-shadow: 0 0 0 2px #000 inset;
        }
        .theme-btn.active {
            background: linear-gradient(135deg, var(--panel-2), var(--panel));
            color: var(--text);
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent) inset;
        }
        .theme-note {
            max-width: 1600px;
            margin: 0 auto 18px;
            color: var(--muted);
            font-size: 10px;
            letter-spacing: 0.5px;
        }
        h1, h2 { margin: 0; }
        h1 { font-size: 20px; }
        h2 { font-size: 15px; }
        .container {
            max-width: 1600px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: minmax(0, 1.5fr) minmax(360px, 1fr);
            gap: 28px;
        }
        @media (max-width: 960px) {
            .container { grid-template-columns: 1fr; }
        }
        .nav-card {
            max-width: 1600px;
            margin: 0 auto 12px;
            background: linear-gradient(145deg, var(--panel), var(--panel-2));
            border: 2px solid #1f1f1f;
            box-shadow: 0 0 0 2px #000, 8px 8px 0 rgba(0,0,0,0.45);
            padding: 14px 16px;
            color: var(--text);
            font-size: 11px;
        }
        .card {
            background: linear-gradient(145deg, var(--panel), var(--panel-2));
            border: 2px solid #1f1f1f;
            box-shadow:
                0 0 0 2px #000,
                8px 8px 0 rgba(255,122,24,0.15);
            padding: 22px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            gap: 12px;
        }
        .date {
            color: var(--muted);
            font-size: 10px;
            text-transform: uppercase;
        }
        .tabs {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 12px;
        }
        .tab {
            padding: 14px 12px 12px;
            border: 2px solid #222;
            background: #0c0c0c;
            color: var(--muted);
            cursor: pointer;
            text-align: center;
            font-size: 12px;
            letter-spacing: 1px;
            box-shadow: 0 0 0 2px #000 inset;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .tab.active {
            color: var(--text);
            background: linear-gradient(145deg, #1a1a1a, #121212);
            box-shadow: 0 0 0 2px var(--accent) inset, 4px 4px 0 rgba(0,0,0,0.45);
            transform: translateY(-2px);
        }
        .timer {
            font-size: 82px;
            text-align: center;
            margin: 22px 0 10px;
            letter-spacing: 3px;
            color: var(--accent-2);
            text-shadow: 0 0 8px rgba(255,122,24,0.5);
        }
        .label {
            text-align: center;
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 14px;
        }
        .actions {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 14px;
        }
        .btn {
            padding: 13px 18px 11px;
            border: 2px solid var(--accent);
            background: linear-gradient(145deg, #ff8c26, #ff5a1f);
            color: #0a0a0a;
            cursor: pointer;
            font-size: 12px;
            letter-spacing: 1px;
            box-shadow: 0 0 0 2px #000, 4px 4px 0 rgba(0,0,0,0.6);
            text-transform: uppercase;
            transition: transform 0.08s ease, box-shadow 0.1s ease;
        }
        .btn:hover { box-shadow: 0 0 0 2px #000, 3px 3px 0 rgba(0,0,0,0.8); }
        .btn:active { transform: translateY(2px); box-shadow: 0 0 0 2px #000, 2px 2px 0 rgba(0,0,0,0.8); }
        .btn.ghost {
            background: #0c0c0c;
            color: var(--text);
            border-color: #2b2b2b;
            box-shadow: 0 0 0 2px #000, 4px 4px 0 rgba(255,122,24,0.2);
        }
        .btn.secondary {
            background: linear-gradient(145deg, #ffb52c, #ff7a18);
            color: #0c0c0c;
        }
        .mode-toggle {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .mode-toggle button {
            padding: 9px 12px 8px;
            border: 2px solid #222;
            background: #0e0e0e;
            color: var(--muted);
            cursor: pointer;
            font-size: 11px;
            letter-spacing: 0.5px;
            box-shadow: 0 0 0 2px #000 inset;
        }
        .mode-toggle button.active {
            color: var(--text);
            background: linear-gradient(145deg, #1c1c1c, #121212);
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent) inset;
        }
        .input-group {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        input, select {
            background: #0c0c0c;
            border: 2px solid #1f1f1f;
            color: var(--text);
            padding: 12px 14px 10px;
            font-size: 12px;
            flex: 1;
            min-width: 240px;
            box-shadow: 0 0 0 2px #000 inset;
        }
        label { color: var(--muted); font-size: 11px; display: block; margin-bottom: 6px; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            font-size: 12px;
        }
        th, td {
            padding: 11px 8px;
            text-align: left;
            border-bottom: 2px solid #1f1f1f;
        }
        th { color: var(--muted); font-weight: 700; letter-spacing: 1px; }
        td input {
            width: 100%;
            background: #0c0c0c;
            border: 2px solid #222;
            color: var(--text);
            padding: 9px 10px 8px;
            font-size: 11px;
            box-shadow: 0 0 0 2px #000 inset;
        }
        .progress {
            height: 10px;
            border: 2px solid #1f1f1f;
            background: #0c0c0c;
            box-shadow: 0 0 0 2px #000 inset;
        }
        .progress span {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, #ff7a18, #ffb52c);
        }
        .pill {
            display: inline-block;
            padding: 6px 10px 5px;
            background: var(--accent);
            border: 2px solid #000;
            color: #0a0a0a;
            font-size: 10px;
            letter-spacing: 0.8px;
            box-shadow: 2px 2px 0 rgba(0,0,0,0.6);
            text-transform: uppercase;
        }
        .live2d-card {
            display: none;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
            padding: 12px 14px;
            border: 2px solid #2e2543;
            background: radial-gradient(circle at 10% 10%, rgba(155,124,248,0.25), transparent 45%),
                linear-gradient(145deg, #1c142a, #120d1c);
            box-shadow: 0 0 0 2px #000 inset, 6px 6px 0 rgba(155,124,248,0.18);
            position: relative;
            overflow: hidden;
        }
        body.theme-xumo .live2d-card { display: flex; }
        .live2d-portrait {
            width: 92px;
            height: 92px;
            border: 2px solid #6a5ab3;
            background: radial-gradient(circle at 45% 30%, rgba(198,180,255,0.5), rgba(46,30,69,0.9)), #0d0817;
            position: relative;
            box-shadow: 0 0 0 2px #0a0811 inset, 4px 4px 0 rgba(0,0,0,0.6);
            overflow: hidden;
        }
        .live2d-face-img {
            position: absolute;
            inset: 4px;
            background-image: var(--xumo-avatar);
            background-size: cover;
            background-position: center;
            filter: drop-shadow(0 0 6px rgba(155,124,248,0.35));
            border-radius: 10px;
        }
        .live2d-bloom {
            position: absolute;
            right: -12px;
            bottom: -8px;
            width: 58px;
            height: 58px;
            background: radial-gradient(circle, rgba(170,120,255,0.25), transparent 65%);
            filter: blur(0.4px);
        }
        .live2d-bubble {
            position: absolute;
            left: 110px;
            top: 10px;
            padding: 10px 12px 8px;
            background: linear-gradient(145deg, rgba(207,189,255,0.18), rgba(120,92,180,0.55));
            border: 2px solid #6a5ab3;
            box-shadow: 0 0 0 2px #0c0814 inset, 4px 4px 0 rgba(0,0,0,0.5);
            font-size: 12px;
            color: var(--text);
            letter-spacing: 0.8px;
            border-radius: 10px;
            opacity: 0;
            transform: translateY(-6px);
            transition: opacity 0.2s ease, transform 0.2s ease;
            pointer-events: none;
        }
        .live2d-bubble::after {
            content: '';
            position: absolute;
            left: -10px;
            top: 14px;
            border: 8px solid transparent;
            border-right-color: #6a5ab3;
            filter: drop-shadow(0 0 0 2px #0c0814);
        }
        .live2d-status {
            font-size: 11px;
            color: var(--text);
            letter-spacing: 0.6px;
        }
        .live2d-card.active .live2d-face-img {
            animation: nod 0.9s ease-in-out 2;
        }
        @keyframes nod {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(2px) rotate(-1deg); }
            50% { transform: translateY(-2px) rotate(1deg); }
            75% { transform: translateY(1px) rotate(-1deg); }
        }
        .footer-note {
            color: var(--muted);
            font-size: 9px;
            margin-top: 10px;
            text-align: right;
            letter-spacing: 0.5px;
        }
        .chart-shell {
            margin-top: 4px;
            border: 2px solid #1f1f1f;
            background: var(--chart-bg);
            box-shadow: 0 0 0 2px #000 inset, 4px 4px 0 rgba(255,122,24,0.15);
            padding: 10px;
        }
        body.theme-stardew .chart-shell {
            background: repeating-linear-gradient(
                45deg,
                #1b120a,
                #1b120a 10px,
                #23160c 10px,
                #23160c 20px
            );
            box-shadow: 0 0 0 2px #000 inset, 6px 6px 0 rgba(156,107,63,0.28);
        }
        body.theme-xumo .chart-shell {
            box-shadow: 0 0 0 2px #000 inset, 6px 6px 0 rgba(155,124,248,0.22);
            background: radial-gradient(circle at 70% 20%, rgba(150,120,255,0.18), transparent 45%), var(--chart-bg);
        }
        #chart {
            width: 100%;
            height: 380px;
        }
        .chart-fallback {
            color: var(--muted);
            font-size: 11px;
            text-align: center;
            padding: 32px 12px;
            border: 2px dashed #1f1f1f;
            background: #0c0c0c;
        }
    </style>
</head>
<body class="theme-default">
    <header class="top-nav">
        <div class="brand">像素番茄 · 主题切换</div>
        <div class="theme-switch" id="themeSwitcher">
            <button class="theme-btn active" data-theme="default">像素橙</button>
            <button class="theme-btn" data-theme="stardew">星露谷·泥土</button>
            <button class="theme-btn" data-theme="xumo">许墨·紫羽</button>
        </div>
    </header>
    <div class="theme-note">切换皮肤会同步更新背景、控件色调与饼状图配色；“许墨”皮肤下开始计时时会触发 Live2D 风格的微笑点头。</div>
    <div class="nav-card">导航提示：默认为像素橙风格。星露谷皮肤将饼状图换成泥土色块，许墨皮肤提供紫色鸢尾花氛围与互动头像，可随时切换。</div>
    <div class="container">
        <section class="card">
            <div class="header">
                <div>
                    <h1>番茄钟 & 正计时</h1>
                    <div class="date" id="today"></div>
                </div>
                <span class="pill focus" id="sessionLabel">番茄钟</span>
            </div>

            <div class="tabs" aria-label="计时模式切换">
                <button class="tab active" data-type="pomodoro">番茄钟</button>
                <button class="tab" data-type="stopwatch">正计时</button>
            </div>

            <div class="label" id="modeLabel">25 分钟专注</div>
            <div class="timer" id="display">25:00</div>

            <div class="actions">
                <button class="btn primary" id="startPause">开始</button>
                <button class="btn ghost" id="reset">重置</button>
            </div>

            <div class="live2d-card" id="live2dCard" aria-hidden="true">
                <div class="live2d-portrait">
                    <div class="live2d-face-img"></div>
                    <div class="live2d-bloom"></div>
                </div>
                <div class="live2d-bubble" id="live2dBubble">❤</div>
                <div class="live2d-status" id="live2dStatus">许墨：静候开始</div>
            </div>

            <div class="mode-toggle" id="pomodoroModes">
                <button data-mode="focus" class="active">专注 25'</button>
                <button data-mode="short">小憩 5'</button>
                <button data-mode="long">长休 15'</button>
            </div>

            <div class="input-group">
                <label for="taskInput">当前任务</label>
                <input id="taskInput" placeholder="输入任务名称，例如：整理周报" autocomplete="off">
            </div>

            <div class="input-group">
                <label for="focusLength">自定义时长（分钟，可选）</label>
                <input id="focusLength" type="number" min="1" max="180" placeholder="专注时长，例如 30">
                <input id="shortLength" type="number" min="1" max="60" placeholder="小憩时长，例如 5">
                <input id="longLength" type="number" min="1" max="90" placeholder="长休时长，例如 15">
            </div>
            <div class="footer-note">每日数据自动刷新，未命名任务将归到“杂项”。</div>
        </section>

        <section class="card">
            <div class="header">
                <h2>任务统计</h2>
                <div class="date" id="summaryTotal">今日累计 00:00:00</div>
            </div>
            <div class="chart-shell">
                <div id="chart"></div>
            </div>
            <div id="taskTable"></div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <script>
        const tabs = document.querySelectorAll('.tab');
        const modeButtons = document.querySelectorAll('#pomodoroModes button');
        const display = document.getElementById('display');
        const modeLabel = document.getElementById('modeLabel');
        const startPauseBtn = document.getElementById('startPause');
        const resetBtn = document.getElementById('reset');
        const sessionLabel = document.getElementById('sessionLabel');
        const todayEl = document.getElementById('today');
        const taskInput = document.getElementById('taskInput');
        const summaryTotal = document.getElementById('summaryTotal');
        const taskTable = document.getElementById('taskTable');
        const chartContainer = document.getElementById('chart');
        const themeButtons = document.querySelectorAll('.theme-btn');
        const live2dCard = document.getElementById('live2dCard');
        const live2dStatus = document.getElementById('live2dStatus');
        const live2dBubble = document.getElementById('live2dBubble');
        const lengthInputs = {
            focus: document.getElementById('focusLength'),
            short: document.getElementById('shortLength'),
            long: document.getElementById('longLength'),
        };

        const defaults = { focus: 25 * 60, short: 5 * 60, long: 15 * 60 };
        let settings = { ...defaults };

        const themes = {
            default: {
                className: 'theme-default',
                chartColors: ['#ff7a18', '#faae2b', '#5e6ad2', '#35c98d', '#2b2b2b', '#f45c43', '#46c7ff', '#ff9f43'],
                chartBackground: '#0c0c0c',
            },
            stardew: {
                className: 'theme-stardew',
                chartColors: ['#6b3e26', '#9c6b3f', '#c18b56', '#d8b07a', '#e3cba4', '#7ea04d', '#bcd364', '#4a2f1a'],
                chartBackground: '#1b120a',
            },
            xumo: {
                className: 'theme-xumo',
                chartColors: ['#c8b2ff', '#8f7de0', '#5e4a8f', '#2b253a', '#6ad0ff', '#d8d7f5', '#a45bd8', '#7b6bd6'],
                chartBackground: '#0f0b16',
            },
        };
        let currentTheme = 'default';

        const state = {
            type: 'pomodoro',
            mode: 'focus',
            remaining: settings.focus,
            elapsed: 0,
            running: false,
            timerId: null,
        };

        function getTheme() {
            return themes[currentTheme] || themes.default;
        }

        function applyTheme(name) {
            if (!themes[name]) return;
            currentTheme = name;
            document.body.classList.remove(...Object.values(themes).map(t => t.className));
            document.body.classList.add(themes[name].className);
            themeButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.theme === name));
            renderTable();
        }

        function fmtTime(sec) {
            const h = Math.floor(sec / 3600).toString().padStart(2, '0');
            const m = Math.floor((sec % 3600) / 60).toString().padStart(2, '0');
            const s = Math.floor(sec % 60).toString().padStart(2, '0');
            return h === '00' ? `${m}:${s}` : `${h}:${m}:${s}`;
        }

        function todayKey() {
            return new Date().toISOString().slice(0, 10);
        }

        function readData() {
            const raw = localStorage.getItem('pomodoro-log');
            const today = todayKey();
            if (!raw) return { date: today, tasks: {} };
            try {
                const parsed = JSON.parse(raw);
                if (parsed.date !== today) return { date: today, tasks: {} };
                return parsed;
            } catch {
                return { date: today, tasks: {} };
            }
        }

        function writeData(data) {
            localStorage.setItem('pomodoro-log', JSON.stringify(data));
        }

        function addSecondToTask() {
            const data = readData();
            const name = (taskInput.value || '杂项').trim();
            if (!data.tasks[name]) data.tasks[name] = 0;
            data.tasks[name] += 1;
            writeData(data);
            renderTable();
        }

        function renameTask(oldName, newName) {
            const trimmed = (newName || '').trim() || '杂项';
            const data = readData();
            if (!data.tasks[oldName]) return;
            const seconds = data.tasks[oldName];
            delete data.tasks[oldName];
            data.tasks[trimmed] = (data.tasks[trimmed] || 0) + seconds;
            writeData(data);
            if ((taskInput.value || '杂项').trim() === oldName) {
                taskInput.value = trimmed;
            }
            renderTable();
        }

        function commitNameChange(target) {
            if (!target.classList.contains('task-name-input')) return;
            const oldName = target.dataset.name;
            const newName = target.value;
            if (oldName !== newName) renameTask(oldName, newName);
        }

        let live2dTimeout = null;
        function triggerLive2d() {
            if (!live2dCard || currentTheme !== 'xumo') return;
            live2dCard.classList.add('active');
            live2dStatus.textContent = '许墨：微笑点头';
            if (live2dBubble) {
                live2dBubble.style.opacity = '1';
                live2dBubble.style.transform = 'translateY(0)';
            }
            if (live2dTimeout) clearTimeout(live2dTimeout);
            live2dTimeout = setTimeout(() => {
                live2dCard.classList.remove('active');
                live2dStatus.textContent = '许墨：静候开始';
                if (live2dBubble) {
                    live2dBubble.style.opacity = '0';
                    live2dBubble.style.transform = 'translateY(-6px)';
                }
            }, 1800);
        }

        let chartInstance = null;

        function renderChart(entries, total) {
            if (!chartContainer) return;
            if (typeof echarts === 'undefined') {
                chartContainer.innerHTML = '<div class="chart-fallback">饼状图资源加载失败，请联网刷新或稍后重试。</div>';
                return;
            }
            if (!chartInstance) {
                chartInstance = echarts.init(chartContainer);
                window.addEventListener('resize', () => chartInstance && chartInstance.resize());
            }
            const palette = getTheme().chartColors;
            const chartBg = getTheme().chartBackground;
            if (!entries.length) {
                chartInstance.clear();
                chartInstance.setOption({
                    title: {
                        text: '暂无数据',
                        left: 'center',
                        top: 'middle',
                        textStyle: { color: '#6a6a6a', fontSize: 12, fontFamily: 'Share Tech Mono' },
                    },
                    backgroundColor: chartBg,
                });
                return;
            }
            const data = entries.map(([name, sec]) => ({ value: sec, name }));
            chartInstance.setOption({
                backgroundColor: chartBg,
                tooltip: {
                    trigger: 'item',
                    formatter: ({ name, value, percent }) => `${name}: ${fmtTime(value)} (${Math.round(percent)}%)`,
                },
                legend: {
                    top: '5%',
                    left: 'center',
                    textStyle: { color: '#fdf4dd', fontFamily: 'Share Tech Mono', fontSize: 11 },
                },
                series: [{
                    name: '今日分布',
                    type: 'pie',
                    radius: ['40%', '70%'],
                    center: ['50%', '55%'],
                    avoidLabelOverlap: false,
                    itemStyle: {
                        borderColor: '#0c0c0c',
                        borderWidth: 2,
                    },
                    label: { show: false, position: 'center' },
                    emphasis: {
                        label: {
                            show: true,
                            fontSize: 18,
                            fontWeight: 'bold',
                            color: '#fdf4dd',
                            formatter: '{b}\n{d}%'
                        },
                    },
                    labelLine: { show: false },
                    data,
                    color: palette,
                }],
            });
        }

        function renderTable() {
            const data = readData();
            const entries = Object.entries(data.tasks).sort((a, b) => b[1] - a[1]);
            const total = entries.reduce((sum, [, sec]) => sum + sec, 0);
            summaryTotal.textContent = `今日累计 ${fmtTime(total)}`;
            if (!entries.length) {
                taskTable.innerHTML = '<p style="color: var(--muted);">还没有记录，开始一次专注或正计时吧。</p>';
                renderChart([], total);
                return;
            }
            const rows = entries.map(([name, sec]) => {
                const percent = total ? Math.round((sec / total) * 100) : 0;
                return `
                    <tr data-name="${name}">
                        <td><input class="task-name-input" data-name="${name}" value="${name}" aria-label="编辑任务名称" /></td>
                        <td>${fmtTime(sec)}</td>
                        <td>${percent}%</td>
                        <td><div class="progress"><span style="width:${percent}%;"></span></div></td>
                    </tr>`;
            }).join('');
            taskTable.innerHTML = `
                <table>
                    <thead>
                        <tr><th>任务</th><th>时长</th><th>占比</th><th></th></tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>`;
            renderChart(entries, total);
        }

        function updateDisplay() {
            if (state.type === 'pomodoro') {
                display.textContent = fmtTime(state.remaining);
            } else {
                display.textContent = fmtTime(state.elapsed);
            }
        }

        function setMode(newMode) {
            state.mode = newMode;
            state.remaining = settings[newMode];
            state.elapsed = 0;
            updateDisplay();
            document.querySelectorAll('#pomodoroModes button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === newMode);
            });
            sessionLabel.textContent = newMode === 'focus' ? '番茄钟' : newMode === 'short' ? '小憩' : '长休';
            const minutes = Math.round(settings[newMode] / 60);
            modeLabel.textContent = `${minutes} 分钟${newMode === 'focus' ? '专注' : '放松'}`;
        }

        function stopTimer() {
            if (state.timerId) clearInterval(state.timerId);
            state.timerId = null;
            state.running = false;
            startPauseBtn.textContent = '开始';
        }

        function tick() {
            if (state.type === 'pomodoro') {
                if (state.remaining <= 0) {
                    stopTimer();
                    return;
                }
                state.remaining -= 1;
                addSecondToTask();
                if (state.remaining === 0) {
                    sessionLabel.textContent = '已完成';
                }
            } else {
                state.elapsed += 1;
                addSecondToTask();
            }
            updateDisplay();
        }

        function startTimer() {
            if (state.running) return;
            state.running = true;
            startPauseBtn.textContent = '暂停';
            triggerLive2d();
            tick();
            state.timerId = setInterval(tick, 1000);
        }

        function toggleStartPause() {
            if (state.running) {
                stopTimer();
            } else {
                startTimer();
            }
        }

        function resetTimer() {
            stopTimer();
            state.elapsed = 0;
            state.remaining = settings[state.mode];
            updateDisplay();
            sessionLabel.textContent = state.mode === 'focus' ? '番茄钟' : state.mode === 'short' ? '小憩' : '长休';
        }

        function handleTabSwitch(nextType) {
            tabs.forEach(t => t.classList.toggle('active', t.dataset.type === nextType));
            state.type = nextType;
            if (nextType === 'pomodoro') {
                setMode(state.mode);
                document.getElementById('pomodoroModes').style.display = 'flex';
                sessionLabel.textContent = state.mode === 'focus' ? '番茄钟' : state.mode === 'short' ? '小憩' : '长休';
            } else {
                stopTimer();
                state.elapsed = 0;
                display.textContent = '00:00';
                modeLabel.textContent = '正计时模式：不限时长';
                document.getElementById('pomodoroModes').style.display = 'none';
                sessionLabel.textContent = '正计时';
            }
        }

        function bindInputs() {
            Object.entries(lengthInputs).forEach(([key, input]) => {
                input.addEventListener('change', () => {
                    const val = Number(input.value);
                    if (!Number.isFinite(val) || val <= 0) { settings[key] = defaults[key]; return; }
                    settings[key] = Math.min(val, 360) * 60;
                    if (state.type === 'pomodoro' && state.mode === key) {
                        state.remaining = settings[key];
                        updateDisplay();
                        modeLabel.textContent = `${val} 分钟${key === 'focus' ? '专注' : '放松'}`;
                    }
                });
            });
        }

        function initThemes() {
            themeButtons.forEach(btn => btn.addEventListener('click', () => applyTheme(btn.dataset.theme)));
            applyTheme('default');
        }

        function initDate() {
            const now = new Date();
            const day = now.toLocaleDateString('zh-Hans', { month: 'long', day: 'numeric', weekday: 'long' });
            todayEl.textContent = day;
        }

        function init() {
            initDate();
            initThemes();
            bindInputs();
            updateDisplay();
            tabs.forEach(tab => tab.addEventListener('click', () => handleTabSwitch(tab.dataset.type)));
            modeButtons.forEach(btn => btn.addEventListener('click', () => setMode(btn.dataset.mode)));
            startPauseBtn.addEventListener('click', toggleStartPause);
            resetBtn.addEventListener('click', resetTimer);
            taskTable.addEventListener('change', (e) => commitNameChange(e.target));
            taskTable.addEventListener('focusout', (e) => commitNameChange(e.target));
            taskTable.addEventListener('keydown', (e) => {
                if (e.target.classList.contains('task-name-input') && e.key === 'Enter') {
                    e.preventDefault();
                    commitNameChange(e.target);
                }
            });
            display.addEventListener('click', triggerLive2d);
            renderTable();
        }

        init();
    </script>
</body>
</html>
